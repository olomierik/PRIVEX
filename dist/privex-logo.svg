<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Main blue-to-violet gradient for the P letterform -->
    <linearGradient id="pvxGrad" x1="120" y1="60" x2="280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Lighter overlay gradient for the curved highlight -->
    <linearGradient id="pvxHighlight" x1="130" y1="70" x2="240" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Lock gradient -->
    <linearGradient id="lockGrad" x1="230" y1="230" x2="300" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── P letterform ── -->
  <!-- Vertical left stroke of P -->
  <rect x="112" y="62" width="48" height="240" rx="24" fill="url(#pvxGrad)" filter="url(#glow)"/>

  <!-- Upper-right bowl of P (outer arc) -->
  <path d="M158 62 h60 a72 72 0 0 1 0 144 h-60 z" fill="url(#pvxGrad)" filter="url(#glow)"/>

  <!-- Inner cutout of P bowl (makes it hollow) -->
  <path d="M160 100 h50 a36 36 0 0 1 0 72 h-50 z" fill="transparent"/>

  <!-- Curved tail / diagonal stroke of P (bottom-right sweep) -->
  <path d="M158 206 L240 302 Q256 326 234 338 Q212 350 198 328 L128 228 z" fill="url(#pvxGrad)" filter="url(#glow)"/>

  <!-- Highlight sheen on P -->
  <path d="M112 86 Q140 62 200 70 Q240 76 262 106 Q242 90 210 86 Q172 82 136 96 z" fill="url(#pvxHighlight)"/>

  <!-- ── Chat bubble inside the P bowl ── -->
  <rect x="162" y="108" width="80" height="54" rx="16" fill="#03080f" stroke="rgba(0,212,255,0.6)" stroke-width="2"/>
  <!-- Three dots -->
  <circle cx="183" cy="135" r="5.5" fill="#00d4ff"/>
  <circle cx="202" cy="135" r="5.5" fill="#00d4ff"/>
  <circle cx="221" cy="135" r="5.5" fill="#00d4ff"/>
  <!-- Chat bubble tail -->
  <path d="M168 162 L162 178 L182 165 z" fill="#03080f" stroke="rgba(0,212,255,0.6)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- ── Lock icon (bottom-right of P tail) ── -->
  <!-- Lock body -->
  <rect x="234" y="268" width="56" height="44" rx="10" fill="url(#lockGrad)" filter="url(#glow)"/>
  <!-- Lock shackle -->
  <path d="M248 268 v-16 a14 14 0 0 1 28 0 v16" stroke="url(#lockGrad)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <!-- Keyhole -->
  <circle cx="262" cy="286" r="6" fill="#03080f"/>
  <rect x="259" y="288" width="6" height="10" rx="3" fill="#03080f"/>
</svg>
